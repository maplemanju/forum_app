name: Docker Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create test env file from GitHub secrets
        run: |
          mkdir -p env
          echo "${{ secrets.TEST_ENV_VARS }}" > env/.env.test

      - name: Run docker-compose services
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from playwright-tests
        # This runs all services, exits when tests finish, and uses the test container's exit code.

      - name: Show logs from test container (if failed)
        if: failure()
        run: docker compose logs playwright-tests

      - name: Tear down
        if: always()
        run: docker compose down
