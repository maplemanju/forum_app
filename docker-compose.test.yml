version: '3.8'

services:
  db-test:
    container_name: db-test
    image: postgres:15
    environment:
      POSTGRES_DB: 'app'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5433:5432' # host:container
    volumes:
      - db-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d app']
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  minio-test:
    container_name: minio-test
    image: minio/minio
    ports:
      - '9002:9000'
      - '9003:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_test:/data
    command: server --console-address ":9001" /data
    networks:
      - test-net

  app-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    container_name: app-test
    environment:
      NODE_ENV: test
      PORT: 3001
    depends_on:
      db-test:
        condition: service_healthy
      minio-test:
        condition: service_started
    networks:
      - test-net
    ports:
      - '3001:3001'

  playwright-tests:
    image: mcr.microsoft.com/playwright:v1.53.2-jammy
    container_name: playwright-tests
    depends_on:
      app-test:
        condition: service_started
    environment:
      CI: 'true'
    networks:
      - test-net
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: sh -c "
      corepack enable &&
      yarn install &&
      npx wait-on http://app-test:3001 &&
      yarn playwright test
      "

volumes:
  db-test:
  minio_data_test:

networks:
  test-net:
