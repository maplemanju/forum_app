services:
  db:
    container_name: db
    image: postgres:15
    environment:
      POSTGRES_DB: 'app'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - '9000:9000' # API port
      - '9001:9001' # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data

  db-test:
    container_name: db-test
    image: postgres:15
    environment:
      POSTGRES_DB: 'app'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5433:5432'
    volumes:
      - db-test:/var/lib/postgresql/data

  minio-test:
    image: minio/minio
    ports:
      - '9002:9002' # API port
      - '9003:9003' # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_test:/data
    command: server --console-address ":9003" /data

volumes:
  db:
  minio_data:
  db-test:
  minio_data_test:
